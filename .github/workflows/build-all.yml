name: Build all profiles
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'

jobs:
  build-all:
    secrets: inherit
    permissions:
      packages: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        profile:
          # amd64
          - name: 'proxy'
            runner: 'ubuntu-26.04'
          - name: 'nas'
            runner: 'ubuntu-26.04'

          # arm64
          - name: 'raspberry-pi'
            runner: 'ubuntu-26.04-arm'

    uses: ./.github/workflows/build.yml
    with:
      profile: ${{ matrix.profile.name }}
      runner: ${{ matrix.profile.runner }}
